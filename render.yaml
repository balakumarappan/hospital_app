# Render Blueprint: DEMO / PILOT deployment with test data only.
# SMS_PROVIDER=demo shows the OTP on screen instead of texting it.
# Switch to SMS_PROVIDER=aws (with DLT registration) before any real patient use.
services:
  - type: web
    name: rural-hospital-app
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    dockerCommand: sh render-start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rural-hospital-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: demo
      - key: SEED_DEMO_DATA
        value: "true"   # sample doctors, patients and appointments; set to false to skip
      - key: PUBLIC_ORIGIN
        sync: false   # e.g. https://rural-hospital-app.onrender.com (no trailing slash)
      - key: ADMIN_PASSWORD
        sync: false   # at least 12 characters; creates/resets the 'admin' login on each start

databases:
  - name: rural-hospital-db
    plan: free
    region: singapore
    databaseName: hospital
    user: hospital
